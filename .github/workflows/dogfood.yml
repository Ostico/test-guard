name: Test Guard (Dogfood)
on:
  pull_request:
    types: [opened, synchronize]

# Cancel superseded runs: only the newest push per PR branch keeps running.
concurrency:
  group: dogfood-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write
  models: read

jobs:
  test-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests with coverage
        run: |
          pip install -r requirements.txt
          pytest tests/ --cov=src --cov-report=xml

      - name: Run Test Guard on itself
        uses: ./
        with:
          coverage-file: coverage.xml
          coverage-threshold: '100'
          ai-model: 'openai/gpt-4.1-mini'
          # Repo-specific: benchmarks/ is a standalone perf harness, not product
          # code under test. Kept OUT of the shipped defaults on purpose — a
          # test-adequacy gate should not silently skip a code tree for every
          # user. Mirrors action.yml's default exclude list + benchmarks/**.
          exclude-patterns: '*.json,*.yml,*.yaml,*.md,*.txt,*.lock,*.toml,*.cfg,*.ini,*.sql,migrations/**,docs/**,*.config.js,*.config.ts,*.config.mjs,*.config.cjs,Gruntfile.js,Gulpfile.js,conftest.py,setup.py,manage.py,noxfile.py,fabfile.py,build.rs,benchmarks/**'
