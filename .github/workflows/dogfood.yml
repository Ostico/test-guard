name: Test Guard (Dogfood)
on:
  pull_request:
    types: [opened, synchronize]

# Cancel superseded runs: only the newest push per PR branch keeps running.
concurrency:
  group: dogfood-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write
  # No `models: read` — it only ever gated GitHub Models, retired 2026-07-30.

jobs:
  test-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests with coverage
        run: |
          pip install -r requirements.txt
          pytest tests/ --cov=src --cov-report=xml

      - name: Run Test Guard on itself
        uses: ./
        with:
          coverage-file: coverage.xml
          coverage-threshold: '100'
          # Gemini 2.5 was shut down ahead of its documented Oct 2026 date and
          # now 404s. flash-lite defaults to minimal thinking, which suits the
          # 2048-token output cap.
          ai-model: 'gemini-3.1-flash-lite'
          # Trailing slash is required — without it the compat layer 404s.
          ai-base-url: 'https://generativelanguage.googleapis.com/v1beta/openai/'
          # Layer 3 needs a provider key. Absent the secret, the gate degrades
          # to Layer 1 + Layer 2 with a warning instead of failing.
          ai-api-key: ${{ secrets.GEMINI_API_KEY }}
          # Gemini 3.x has no "off" for thinking. Its published intelligence
          # scores are reasoning-enabled, and Google recommends thinking for
          # code reasoning, so don't floor this at minimal — the 4096-token
          # default output cap leaves room for a short thought trace.
          ai-reasoning-effort: 'low'
          # Gemini 3.x warns that lowering temperature causes looping and
          # degraded reasoning, so use its recommended default instead of 0.1.
          ai-temperature: '1.0'
          # Repo-specific: benchmarks/ is a standalone perf harness, not product
          # code under test. Kept OUT of the shipped defaults on purpose — a
          # test-adequacy gate should not silently skip a code tree for every
          # user. Unioned onto the defaults, so no need to re-list them.
          extra-exclude-patterns: 'benchmarks/**'
